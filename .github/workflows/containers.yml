# Builds the tool images that no registry provides (currently ATaRVa) and pushes them to ghcr.io.
# The date pins the dependency resolution to the day after the release.
name: containers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['containers/**', '.github/workflows/containers.yml']
permissions:
  contents: read
  packages: write
jobs:
  atarva:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: '0.5.0'
            exclude_newer: '2026-01-01T00:00:00Z'
          - version: '0.7.1'
            exclude_newer: '2026-05-23T00:00:00Z'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: containers/atarva
          build-args: |
            ATARVA_VERSION=${{ matrix.version }}
            EXCLUDE_NEWER=${{ matrix.exclude_newer }}
          tags: ghcr.io/${{ github.repository_owner }}/atarva:${{ matrix.version }}
          push: true
