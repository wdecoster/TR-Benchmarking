# Builds the tool images that no registry provides in a working form (ATaRVa; mahi-mahi; inquiSTR and STRdust releases without a
# bioconda image yet; medaka 2.1.1 with the
# pyabpoa it requires) and pushes them to ghcr.io. For ATaRVa the date pins the dependency resolution to the day after the release.
name: containers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['containers/**', '.github/workflows/containers.yml']
permissions:
  contents: read
  packages: write
jobs:
  atarva:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: '0.5.0'
            exclude_newer: '2026-01-01T00:00:00Z'
          - version: '0.7.1'
            exclude_newer: '2026-05-23T00:00:00Z'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: containers/atarva
          build-args: |
            ATARVA_VERSION=${{ matrix.version }}
            EXCLUDE_NEWER=${{ matrix.exclude_newer }}
          tags: ghcr.io/${{ github.repository_owner }}/atarva:${{ matrix.version }}
          push: true

  medaka:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: '2.1.1'
            pyabpoa: '1.5.1'
            python: '3.10'
            tag: '2.1.1'
          - version: '2.1.1'
            pyabpoa: '1.5.5'
            python: '3.10'
            tag: '2.1.1-pyabpoa1.5.5'     # medaka's version check patched, see docs/ADAPTATIONS.md (A-medaka-1)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: containers/medaka
          build-args: |
            MEDAKA_VERSION=${{ matrix.version }}
            PYABPOA_VERSION=${{ matrix.pyabpoa }}
            PYTHON_VERSION=${{ matrix.python }}
          tags: ghcr.io/${{ github.repository_owner }}/medaka:${{ matrix.tag }}
          push: true

  strdust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: '1.4.2'
            sha256: 'f6c185444345cc64035555fbbfba3fd47be30eaec605c895985b44e92ca66740'    # STRdust-linux-musl of the v1.4.2 release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: containers/strdust
          build-args: |
            STRDUST_VERSION=${{ matrix.version }}
            STRDUST_SHA256=${{ matrix.sha256 }}
          tags: ghcr.io/${{ github.repository_owner }}/strdust:${{ matrix.version }}
          push: true

  inquistr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: '0.28.2'
            sha256: 'cc4ee22d826c9a1d4eea6e478c9ee0235f6c9c452a41b20f62c3b37a07a5b0b5'    # inquiSTR-linux-musl of the v0.28.2 release
          - version: '0.28.3'
            sha256: 'd9348bc406a5d99840a037344c2c9aa9f5377c531ee91fcb8b3d7fbb235c4637'    # inquiSTR-linux-musl of the v0.28.3 release
          - version: '0.28.4'
            sha256: '774a5680a0c3b67368c0051f8ea9cf0ef65fb39530c5909f1018bdf59836b973'    # inquiSTR-linux-musl of the v0.28.4 release
          - version: '0.30.0'
            sha256: 'ddff3d6849ec87f4aa1e13550ba5b35f18b074a6b15f457beb4fb5fba30ecd8c'    # inquiSTR-linux-musl of the v0.30.0 release (matches the digest GitHub lists)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: containers/inquistr
          build-args: |
            INQUISTR_VERSION=${{ matrix.version }}
            INQUISTR_SHA256=${{ matrix.sha256 }}
          tags: ghcr.io/${{ github.repository_owner }}/inquistr:${{ matrix.version }}
          push: true

  mahimahi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: '1.0.0'
            exclude_newer: '2026-10-16T00:00:00Z'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: containers/mahimahi
          build-args: |
            MAHIMAHI_VERSION=${{ matrix.version }}
            EXCLUDE_NEWER=${{ matrix.exclude_newer }}
          tags: ghcr.io/${{ github.repository_owner }}/mahimahi:${{ matrix.version }}
          load: true
          push: false
      # ONT's install check (one HG002 locus, output must be identical to the expected VCF) before pushing
      - name: install check
        run: |
          v=${{ matrix.version }}
          curl -fsSLO https://github.com/nanoporetech/mahi-mahi/releases/download/v$v/mahi-mahi-hg002-chr18-tcf4-v$v.tar.gz
          tar -xzf mahi-mahi-hg002-chr18-tcf4-v$v.tar.gz
          docker run --rm -u $(id -u):$(id -g) -v "$PWD/mahi-mahi-hg002-chr18-tcf4:/check" -w /check \
              ghcr.io/${{ github.repository_owner }}/mahimahi:$v bash ./verify-mahi-mahi-installation.sh | tee check.log
          grep -q '^PASS: mahi-mahi install check completed successfully.' check.log
      - run: docker push ghcr.io/${{ github.repository_owner }}/mahimahi:${{ matrix.version }}
